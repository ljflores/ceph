teuthology:
  postmerge:
    # If rocky is selected, replace it with ubuntu.
    #   This applies to any release < Tentacle because
    #   rocky support only goes as far back as Tentacle.
    - |
      if yaml.os_type == "rocky" then
        print("rocky is not supported on releases < Tentacle; replacing with ubuntu")
        yaml.os_type = "ubuntu"
        yaml.os_version = "22.04"
        yaml.ktype = "distro"
      end
overrides:
  ceph:
    log-ignorelist:
      - \(MDS_ALL_DOWN\)
      - \(MDS_UP_LESS_THAN_MAX\)
      - \(OSD_SLOW_PING_TIME
      - reached quota
      - overall HEALTH_
      - \(CACHE_POOL_NO_HIT_SET\)
      - \(POOL_FULL\)
      - \(SMALLER_PGP_NUM\)
      - \(SLOW_OPS\)
      - \(CACHE_POOL_NEAR_FULL\)
      - \(POOL_APP_NOT_ENABLED\)
      - \(PG_AVAILABILITY\)
      - \(OBJECT_MISPLACED\)
      - slow request
      - \(MON_DOWN\)
      - noscrub
      - nodeep-scrub
      - osds down
